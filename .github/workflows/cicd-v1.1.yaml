  build:
    name: Build and Push Image
#    needs: sonar
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image: ${{ steps.meta.outputs.image }}
      env_name: ${{ steps.vars.outputs.env_name }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build application jar
        run: mvn -B clean package -DskipTests

#      - name: Configure AWS credentials via OIDC
#        uses: aws-actions/configure-aws-credentials@v4
#        with:
#          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
#          aws-region: ${{ env.AWS_REGION }}
#
#      - name: Login to Amazon ECR
#        id: login-ecr
#        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: 'true'

      - name: Resolve environment
        id: vars
        shell: bash
        run: |
          case "${{ github.ref_name }}" in
            dev)
              echo "env_name=dev" >> "$GITHUB_OUTPUT"
              ;;
            stag)
              echo "env_name=stag" >> "$GITHUB_OUTPUT"
              ;;
            prod)
              echo "env_name=prod" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${{ github.ref_name }}"
              exit 1
              ;;
          esac

      - name: Build and push Docker image
        id: meta
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          ENV_NAME: ${{ steps.vars.outputs.env_name }}
          IMAGE_TAG: ${{ github.sha }}-${{ steps.vars.outputs.env_name }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build --build-arg ENV="$ENV_NAME" -t "$IMAGE_URI" -t "$ECR_REGISTRY/$REPOSITORY:latest" .
          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$REPOSITORY:latest"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ECS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

#      - name: Configure AWS credentials via OIDC
#        uses: aws-actions/configure-aws-credentials@v4
#        with:
#          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
#          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: 'true'

      - name: Resolve ECS settings
        id: ecs
        shell: bash
        run: |
          case "${{ github.ref_name }}" in
            dev)
              echo "task_def=dev-td-demo-cicd-github-action.json" >> "$GITHUB_OUTPUT"
              echo "container_name=dev-ctn-demo-cicd-github-action" >> "$GITHUB_OUTPUT"
              echo "cluster_name=dev-cluster-demo-cicd-github-action" >> "$GITHUB_OUTPUT"
              echo "service_name=dev-service-demo-cicd-github-action" >> "$GITHUB_OUTPUT"
              ;;
            stag)
              echo "task_def=stag-td-demo-cicd-github-action.json" >> "$GITHUB_OUTPUT"
              echo "container_name=stag-ctn-demo-cicd-github-action" >> "$GITHUB_OUTPUT"
              echo "cluster_name=stag-cluster-demo-cicd-github-action" >> "$GITHUB_OUTPUT"
              echo "service_name=stag-service-demo-cicd-github-action" >> "$GITHUB_OUTPUT"
              ;;
            prod)
              echo "task_def=prod-td-demo-cicd-github-action.json" >> "$GITHUB_OUTPUT"
              echo "container_name=prod-ctn-demo-cicd-github-action" >> "$GITHUB_OUTPUT"
              echo "cluster_name=prod-cluster-demo-cicd-github-action" >> "$GITHUB_OUTPUT"
              echo "service_name=prod-service-demo-cicd-github-action" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${{ github.ref_name }}"
              exit 1
              ;;
          esac

      - name: Render ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.ecs.outputs.task_def }}
          container-name: ${{ steps.ecs.outputs.container_name }}
          image: ${{ needs.build.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ steps.ecs.outputs.service_name }}
          cluster: ${{ steps.ecs.outputs.cluster_name }}
          wait-for-service-stability: true

  health-check:
    name: Health Check
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve health check URL
        id: url
        shell: bash
        run: |
          case "${{ github.ref_name }}" in
            dev)
              echo "health_url=https://dev.tungphongdo89.click/health-check" >> "$GITHUB_OUTPUT"
              ;;
            stag)
              echo "health_url=https://stag.tungphongdo89.click/health-check" >> "$GITHUB_OUTPUT"
              ;;
            prod)
              echo "health_url=https://tungphongdo89.click/health-check" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${{ github.ref_name }}"
              exit 1
              ;;
          esac

      - name: Wait for app to become healthy
        shell: bash
        run: |
          URL="${{ steps.url.outputs.health_url }}"

          for i in {1..12}; do
            STATUS=$(curl -k -o /dev/null -s -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed: $URL"
              exit 0
            fi

            echo "Attempt $i failed with HTTP $STATUS. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Health check failed after multiple attempts: $URL"
          exit 1
