name: Build, Scan, and Deploy to AWS ECS

on:
  push:
    branches:
      - dev
      - stag
      - prod
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: dev-demo-cicd-github-action-registry
  SONAR_PROJECT_KEY: corp-report

jobs:
